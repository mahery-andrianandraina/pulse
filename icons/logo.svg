<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Lightning bolt -->
  <path d="M68 8 L42 54 L58 54 L38 112 L88 50 L68 50 L86 8 Z" 
        fill="url(#pulse-grad)" filter="url(#glow)" opacity="0.95"/>
  <!-- Pulse wave accent -->
  <path d="M16 60 Q30 60 36 42 Q42 24 48 42 Q54 60 60 60" 
        stroke="url(#pulse-grad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M60 60 Q66 60 72 78 Q78 96 84 78 Q90 60 104 60" 
        stroke="url(#pulse-grad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
